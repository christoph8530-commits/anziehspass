<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#A9DCFF">
  <title>Anziehspass</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Start: Figur wählen -->
  <section id="screen-start" class="screen">
    <button id="btn-parent" class="round small corner" aria-label="Elternbereich"><img src="assets/emoji/emoji_u23f1.svg" alt="" draggable="false"></button>
    <div id="figure-choice"></div>
    <button id="btn-gallery" class="round big" aria-label="Galerie">
      <img src="assets/emoji/emoji_u1f5bc.svg" alt="" draggable="false">
      <span class="badge gallery-count" hidden>0</span>
    </button>
  </section>

  <!-- Anziehraum -->
  <section id="screen-dress" class="screen" hidden>
    <header class="toolbar">
      <button id="btn-home" class="round" aria-label="Zurück"><img src="assets/emoji/emoji_u1f3e0.svg" alt="" draggable="false"></button>
      <span class="spacer"></span>
      <button id="btn-random" class="round" aria-label="Zufall"><img src="assets/emoji/emoji_u1f3b2.svg" alt="" draggable="false"></button>
      <button id="btn-reset" class="round" aria-label="Alles ausziehen"><img src="assets/emoji/emoji_u1f9f9.svg" alt="" draggable="false"></button>
      <button id="btn-save" class="round save" aria-label="Speichern"><img src="assets/emoji/emoji_u1f4be.svg" alt="" draggable="false"></button>
      <button id="btn-dress-gallery" class="round" aria-label="Galerie">
        <img src="assets/emoji/emoji_u1f5bc.svg" alt="" draggable="false">
        <span class="badge gallery-count" hidden>0</span>
      </button>
    </header>
    <div id="stage"></div>
    <nav id="tabs"></nav>
    <div id="tray"></div>
  </section>

  <!-- Galerie -->
  <section id="screen-gallery" class="screen" hidden>
    <header class="toolbar">
      <button id="btn-gallery-home" class="round" aria-label="Zurück"><img src="assets/emoji/emoji_u1f3e0.svg" alt="" draggable="false"></button>
      <span class="spacer"></span>
      <button id="btn-show" class="round play" aria-label="Modenschau"><img src="assets/emoji/emoji_u25b6.svg" alt="" draggable="false"></button>
    </header>
    <div id="gallery-grid"></div>
    <div id="gallery-empty" hidden><img src="assets/emoji/emoji_u1f4be.svg" alt="" draggable="false"></div>
  </section>

  <!-- Modenschau: alle gespeicherten Looks nacheinander auf dem Laufsteg -->
  <section id="screen-show" class="screen" hidden>
    <div id="runway"></div>
    <header class="toolbar overlay">
      <button id="btn-show-home" class="round" aria-label="Zurück"><img src="assets/emoji/emoji_u1f3e0.svg" alt="" draggable="false"></button>
    </header>
  </section>

  <!-- Elternmenü (lange auf ein Bild in der Galerie drücken) -->
  <dialog id="look-dialog">
    <div id="dialog-preview"></div>
    <div class="dialog-buttons">
      <button id="btn-download" class="text-btn">Bild herunterladen</button>
      <button id="btn-share" class="text-btn" hidden>Teilen</button>
      <button id="btn-delete" class="text-btn danger">Löschen</button>
      <button id="btn-cancel" class="text-btn plain">Abbrechen</button>
    </div>
  </dialog>


  <!-- Spielzeit: Balken oben -->
  <div id="timer-bar" hidden><div></div></div>

  <!-- Erinnerung (z.B. noch 5 Minuten) -->
  <div id="reminder" class="layer" hidden>
    <div class="reminder-card">
      <img src="assets/emoji/emoji_u23f3.svg" alt="" draggable="false">
      <div id="reminder-pie"></div>
    </div>
  </div>

  <!-- Sperrbildschirm, wenn die Spielzeit um ist -->
  <div id="lock" class="layer" hidden>
    <div class="stars"></div>
    <img class="moon" src="assets/emoji/emoji_u1f319.svg" alt="" draggable="false">
    <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
    <p class="lock-text">Schluss für heute</p>
    <button id="btn-unlock" class="round small" aria-label="Entsperren"><img src="assets/emoji/emoji_u1f512.svg" alt="" draggable="false"></button>
  </div>

  <!-- Elternbereich -->
  <div id="parent" class="layer" hidden>
    <div class="panel">
      <h2>Spielzeit</h2>
      <p id="timer-status"></p>
      <div id="timer-running" class="panel-row" hidden>
        <button id="btn-add10" class="text-btn">+10 Min.</button>
        <button id="btn-stop-timer" class="text-btn">Timer stoppen</button>
      </div>
      <p class="panel-hint">Neuen Timer starten:</p>
      <div id="duration-grid"></div>
      <p class="panel-hint">Erinnerung bei 15, 10 und 5 Minuten, danach wird die App gesperrt.</p>
      <button id="btn-lock-now" class="text-btn danger">Jetzt sperren</button>
      <button id="btn-change-pin" class="text-btn">PIN ändern</button>
      <button id="btn-parent-close" class="text-btn plain">Schliessen</button>
    </div>
  </div>

  <!-- PIN-Eingabe -->
  <div id="pin" class="layer" hidden>
    <div class="panel pin-panel">
      <p id="pin-title"></p>
      <div id="pin-dots"></div>
      <p id="pin-blocked" hidden>Zu viele Versuche. Bitte <span id="pin-blocked-sec"></span> s warten.</p>
      <div id="pin-pad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="cancel" class="pin-fn" aria-label="Abbrechen">✕</button><button data-key="0">0</button><button data-key="back" class="pin-fn" aria-label="Löschen">⌫</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
